mcq:String.raw`
Q: Which feature is NOT part of Java 17 (it arrived as final in Java 21)?
- Sealed classes
- Records
- Pattern matching for instanceof
* Virtual threads
E: Records (16), pattern matching for instanceof (16) and sealed classes (17) are all final in Java 17. Virtual threads (Project Loom) became final in Java 21.
Q: How many null keys can a {{HashMap}} hold?
- None
* One
- Unlimited
- One, but only if there are no null values
E: HashMap allows exactly one null key (stored in bucket 0) and any number of null values. Hashtable and ConcurrentHashMap allow no null keys or values.
Q: Which Map is best for a heavily concurrent, read-and-write workload?
- Hashtable
- Collections.synchronizedMap(new HashMap())
* ConcurrentHashMap
- TreeMap
E: ConcurrentHashMap uses fine-grained locking/CAS per bin, so many threads can read and write at once. Hashtable and synchronizedMap lock the whole map.
Q: What does this print?
~~~
String a = "hi"; String b = "hi"; String c = new String("hi");
System.out.println((a == b) + " " + (a == c));
~~~
* true false
- true true
- false false
- false true
E: Literals are interned in the string pool, so a and b reference the same object. new String() creates a separate heap object, so a == c is false (a.equals(c) is true).
Q: Which statement about equals() and hashCode() is the required contract?
- If hashCodes are equal, equals() must return true
* If equals() returns true, the hashCodes must be equal
- They are independent of each other
- hashCode must be unique per object
E: Equal objects must have equal hash codes. The reverse is not required: different objects may collide on hash code.
Q: Which of these is a checked exception?
- NullPointerException
- ArithmeticException
* IOException
- IllegalArgumentException
E: Checked exceptions extend Exception but not RuntimeException and must be declared or caught. IOException is checked; the others are RuntimeExceptions.
Q: What does the {{volatile}} keyword guarantee?
* Visibility of writes across threads (and ordering), but not atomicity of compound actions
- Atomicity of count++
- Mutual exclusion like synchronized
- That the variable is stored on the stack
E: volatile makes writes visible to other threads and prevents reordering. count++ is read-modify-write and still needs AtomicInteger or synchronized.
Q: Which Stream operation is terminal?
- map
- filter
- peek
* collect
E: Intermediate operations (map, filter, peek, sorted) are lazy and return a Stream. Terminal operations (collect, forEach, reduce, count) trigger processing.
Q: What makes an interface a functional interface?
- It has only default methods
* It has exactly one abstract method
- It is annotated with @Override
- It has no methods
E: A functional interface has exactly one abstract method (default and static methods don't count). @FunctionalInterface is optional but makes the compiler check it.
Q: Time complexity of {{get(index)}} on ArrayList vs LinkedList?
* O(1) vs O(n)
- O(n) vs O(1)
- O(1) vs O(1)
- O(log n) vs O(n)
E: ArrayList is backed by an array, so random access is O(1). LinkedList must walk nodes, so it is O(n).
Q: What must a resource implement to be used in try-with-resources?
- Serializable
- Closeable only
* AutoCloseable (Closeable extends it)
- Runnable
E: try-with-resources accepts anything implementing java.lang.AutoCloseable. Closeable is a sub-interface used by I/O classes.
Q: Since Java 9, the default garbage collector in the HotSpot JVM is:
- Serial GC
- Parallel GC
* G1 GC
- ZGC
E: G1 became the default in Java 9. ZGC and Shenandoah are low-latency options you enable explicitly.
Q: In Java 8+ HashMap, when a single bucket grows long, it is converted to:
- A linked list
* A balanced red-black tree (when the bin has 8+ entries and table size is at least 64)
- A new HashMap
- An array
E: Treeification turns worst-case bucket lookup from O(n) to O(log n). Below 6 entries it converts back to a list.
Q: Which is the best way to avoid a NullPointerException when a value may be absent from a method result?
- Return null and document it
* Return Optional<T> and let the caller use orElse / map / ifPresent
- Catch NullPointerException everywhere
- Use assert statements
E: Optional makes absence explicit in the API. Use Optional.ofNullable(x) to wrap a possibly-null value; don't use Optional for fields or parameters.
Q: The {{final}} keyword on a class means:
- Its fields cannot change
* It cannot be subclassed
- It cannot be instantiated
- All methods are static
E: A final class (e.g. String) cannot be extended. A final method cannot be overridden; a final variable cannot be reassigned.
Q: Which ExecutorService is suited to running many short-lived async tasks with a bounded pool?
- new Thread() for each task
* Executors.newFixedThreadPool(n) (or a ThreadPoolExecutor with a bounded queue)
- Runtime.exec()
- Thread.sleep()
E: Reusing a bounded pool avoids the cost and risk of creating unbounded threads. In production prefer a ThreadPoolExecutor with an explicit bounded queue and rejection policy.
Q: Which Java collection keeps insertion order and rejects duplicates?
- HashSet
- TreeSet
* LinkedHashSet
- ArrayList
E: LinkedHashSet = HashSet + a doubly-linked list for insertion order. TreeSet sorts; HashSet has no order.

## Explain the four pillars of OOP with Java examples.
- **Encapsulation**: hide state behind methods. Private fields + getters/validated setters, e.g. a {{LoanAccount}} whose {{balance}} only changes through {{disburse()}} and {{repay()}}.
- **Abstraction**: expose what, hide how. An interface {{PaymentGateway}} with {{pay()}}, implementations hide bank-specific details.
- **Inheritance**: reuse and specialise. {{class SavingsAccount extends Account}}.
- **Polymorphism**: one interface, many forms. Compile-time = method overloading; runtime = overriding, e.g. {{Account a = new SavingsAccount(); a.calculateInterest();}} calls the subclass method.

Tip for the exam: give one tiny code line per pillar; examiners reward concrete examples.
## Abstract class vs interface (Java 8+)?
- An abstract class can have state (instance fields), constructors and any access modifiers; a class can extend only one.
- An interface has no instance state; since Java 8 it can have {{default}} and {{static}} methods, since Java 9 {{private}} methods. A class can implement many.
- Use an abstract class for a shared base with common state/behaviour ("is-a" with code reuse). Use an interface for a capability/contract ("can-do"), e.g. {{Comparable}}, {{Serializable}}.
## How does HashMap work internally?
1. {{put(k,v)}} computes {{k.hashCode()}}, spreads it ({{h ^ (h >>> 16)}}) and finds the bucket index {{(n-1) & hash}}.
2. If the bucket is empty the node is stored; otherwise it walks the bin and uses {{equals()}} to replace an existing key or append a new node.
3. Since Java 8 a bin with 8+ nodes (and table size at least 64) becomes a red-black tree, so worst case is O(log n).
4. Default capacity 16, load factor 0.75: when size > capacity x 0.75 the table doubles and entries are redistributed (rehash).
5. Not thread-safe; use ConcurrentHashMap for concurrency.
## Write a Java method that returns the first non-repeating character in a string.
~~~java
public static Character firstUnique(String s) {
    Map<Character, Integer> count = new LinkedHashMap<>();
    for (char c : s.toCharArray()) count.merge(c, 1, Integer::sum);
    for (Map.Entry<Character, Integer> e : count.entrySet())
        if (e.getValue() == 1) return e.getKey();
    return null; // none
}
// firstUnique("swiss") -> 'w'
~~~
LinkedHashMap keeps insertion order, so the first entry with count 1 is the answer. O(n) time, O(k) space.
## Explain the SOLID principles.
- **S**ingle responsibility: a class has one reason to change (separate {{ReportService}} from {{ReportPdfExporter}}).
- **O**pen/closed: open for extension, closed for modification (add a new {{PaymentGateway}} implementation instead of editing a switch).
- **L**iskov substitution: subtypes must be usable wherever the base type is expected without breaking behaviour.
- **I**nterface segregation: many small interfaces over one fat one.
- **D**ependency inversion: depend on abstractions; Spring's constructor injection of interfaces is the textbook example.
## Write Java code using streams: group employees by department and get the average salary of each.
~~~java
Map<String, Double> avg = employees.stream()
    .collect(Collectors.groupingBy(Employee::getDept,
             Collectors.averagingDouble(Employee::getSalary)));

// Highest-paid employee per department:
Map<String, Optional<Employee>> top = employees.stream()
    .collect(Collectors.groupingBy(Employee::getDept,
             Collectors.maxBy(Comparator.comparingDouble(Employee::getSalary))));
~~~
## Thread vs Runnable vs ExecutorService vs CompletableFuture?
- {{Thread}}: a raw OS-backed thread; creating many is expensive.
- {{Runnable}}/{{Callable}}: the task; Callable returns a value and can throw checked exceptions.
- {{ExecutorService}}: a managed thread pool that reuses threads and returns {{Future}}s.
- {{CompletableFuture}}: composable async pipelines ({{supplyAsync().thenApply().thenCombine().exceptionally()}}) without blocking on {{get()}}.
- Java 21 adds virtual threads for massive I/O concurrency, but the ToR targets Java 17 style code.

Q: {{@SpringBootApplication}} is a combination of:
* @Configuration, @EnableAutoConfiguration, @ComponentScan
- @Controller, @Service, @Repository
- @Configuration, @EnableWebMvc, @Bean
- @Component, @Autowired, @Value
E: It marks the configuration class, turns on auto-configuration, and scans the package and sub-packages for components.
Q: The default scope of a Spring bean is:
* singleton
- prototype
- request
- session
E: One instance per ApplicationContext. prototype gives a new instance each lookup; request/session exist only in web contexts.
Q: Which dependency-injection style is recommended by the Spring team?
- Field injection with @Autowired
- Setter injection everywhere
* Constructor injection
- Static factory lookup
E: Constructor injection makes dependencies explicit and final, works without reflection in tests, and fails fast if something is missing.
Q: By default, {{@Transactional}} rolls back on:
- Every exception
* RuntimeException and Error only
- Checked exceptions only
- Nothing unless rollbackFor is set
E: Checked exceptions commit by default. Use @Transactional(rollbackFor = Exception.class) to also roll back on checked exceptions.
Q: A public method annotated with @Transactional is called from another method in the same class. What happens?
- A new transaction always starts
* The annotation is ignored, because the call bypasses the Spring proxy (self-invocation)
- The application fails to start
- It runs in a nested transaction
E: Spring transactions use AOP proxies. Internal calls do not go through the proxy. Move the method to another bean or inject the proxy.
Q: Default transaction propagation is:
* REQUIRED
- REQUIRES_NEW

## How does Spring Boot auto-configuration work?
- {{@EnableAutoConfiguration}} loads candidate configuration classes listed in {{META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports}} (spring.factories in Boot 2).
- Each class is guarded by conditions: {{@ConditionalOnClass}} (library on classpath), {{@ConditionalOnMissingBean}} (you haven't defined your own), {{@ConditionalOnProperty}}.
- Example: H2 or PostgreSQL driver on the classpath plus {{spring.datasource.url}} = a HikariCP DataSource is created for you.
- Your own beans win because of @ConditionalOnMissingBean. Debug with {{--debug}} or the {{/actuator/conditions}} endpoint.
## Design a layered CRUD REST API in Spring Boot (show code).
~~~java
@Entity
public class PartnerOrg {
  @Id @GeneratedValue(strategy = GenerationType.SEQUENCE) Long id;
  @Column(nullable = false, unique = true) String code;
  String name;
}

public record PartnerOrgDto(Long id, @NotBlank String code, @NotBlank String name) {}

public interface PartnerOrgRepository extends JpaRepository<PartnerOrg, Long> {
  boolean existsByCode(String code);
}

@Service @RequiredArgsConstructor
public class PartnerOrgService {
  private final PartnerOrgRepository repo;
  @Transactional
  public PartnerOrgDto create(PartnerOrgDto dto) {
    if (repo.existsByCode(dto.code())) throw new DuplicateException("code exists");
    PartnerOrg po = new PartnerOrg(); po.code = dto.code(); po.name = dto.name();
    po = repo.save(po);
    return new PartnerOrgDto(po.id, po.code, po.name);
  }
  @Transactional(readOnly = true)
  public Page<PartnerOrgDto> list(Pageable p) {
    return repo.findAll(p).map(x -> new PartnerOrgDto(x.id, x.code, x.name));
  }
}

@RestController @RequestMapping("/api/v1/partner-orgs") @RequiredArgsConstructor
public class PartnerOrgController {
  private final PartnerOrgService service;
  @PostMapping
  public ResponseEntity<PartnerOrgDto> create(@Valid @RequestBody PartnerOrgDto dto) {
    PartnerOrgDto saved = service.create(dto);
    return ResponseEntity.created(URI.create("/api/v1/partner-orgs/" + saved.id())).body(saved);
  }
  @GetMapping
  public Page<PartnerOrgDto> list(Pageable pageable) { return service.list(pageable); }
}

@RestControllerAdvice
class ApiErrors {
  @ExceptionHandler(DuplicateException.class)
  ProblemDetail dup(DuplicateException e) {
    return ProblemDetail.forStatusAndDetail(HttpStatus.CONFLICT, e.getMessage());
  }
}
~~~
Points to mention: DTOs instead of exposing entities, validation, 201 + Location header, pagination, central error handling, transactions in the service layer, versioned URL.
## How does @Transactional work and what are its pitfalls?
- Spring wraps the bean in a proxy (JDK dynamic or CGLIB). The proxy opens a transaction through the PlatformTransactionManager, calls the method, then commits or rolls back.
- Pitfalls: self-invocation bypasses the proxy; it only applies to public methods (Spring 6 also supports protected/package-private with CGLIB, but stay public); checked exceptions don't roll back by default; catching an exception inside the method hides it from the proxy; long transactions holding DB locks; calling a remote API inside a transaction.
- Use {{readOnly = true}} for queries (Hibernate skips dirty checking), {{REQUIRES_NEW}} for audit logs that must persist even when the main transaction fails.
## Describe the Spring bean lifecycle.
1. Instantiate (constructor) and inject dependencies.
2. Aware callbacks ({{BeanNameAware}}, {{ApplicationContextAware}}).
3. {{BeanPostProcessor.postProcessBeforeInitialization}}.
4. Init: {{@PostConstruct}}, then {{InitializingBean.afterPropertiesSet()}}, then custom init-method.
5. {{postProcessAfterInitialization}} (proxies for @Transactional/@Async are created here).
6. Bean in use.
7. On shutdown: {{@PreDestroy}}, {{DisposableBean.destroy()}}, custom destroy-method. (Prototype beans are not destroyed by the container.)
## Explain how you'd use Spring Batch to process a bulk CSV upload of loan records.
- **Job** made of **Steps**. A chunk-oriented step: {{ItemReader}} (FlatFileItemReader for CSV) to {{ItemProcessor}} (validate, map, enrich) to {{ItemWriter}} (JdbcBatchItemWriter / JpaItemWriter).
- {{chunk(500)}}: reads and processes 500 items, then writes and commits them in one transaction.
- {{JobRepository}} stores execution metadata (status, read/write/skip counts), so a failed job can **restart** from the last committed chunk.
- Fault tolerance: {{.faultTolerant().skip(ValidationException.class).skipLimit(100).retry(DeadlockLoserDataAccessException.class)}}; write skipped rows to an error report.
- Trigger asynchronously: the upload API saves the file, launches the job with a TaskExecutor-backed JobLauncher, returns 202 Accepted + a job id; the UI polls status.
- Scale with partitioning (split the file by ranges) or multi-threaded steps.

Q: A JWT consists of:
* Header, payload and signature, Base64URL-encoded and separated by dots
- Username, password and expiry
- An encrypted blob only the server can read
- A session ID and a cookie
E: A signed JWT (JWS) is header.payload.signature. Anyone can decode the payload; the signature only proves integrity.
Q: Is the payload of a standard signed JWT encrypted?
- Yes, always
* No, it is only Base64URL-encoded; never put secrets in it (use JWE if you need encryption)
- Only when using RS256
- Only the exp claim is encrypted

Q: Which OAuth2 flow is recommended for a React/Angular SPA or a mobile app?

- Resource Owner Password Credentials
* Authorization Code with PKCE
- Client Credentials
E: Implicit and password grants are deprecated by current OAuth security best practice. PKCE protects public clients that cannot keep a secret.
Q: Which OAuth2 grant fits service-to-service (machine-to-machine) calls?
- Authorization Code
* Client Credentials
- Device Code

- A single user account
* An isolated space that manages its own users, clients, roles and settings
- A type of token
- A database table

Q: Which is the right way to store user passwords?
- MD5 hash
- SHA-1 hash

- Extend WebSecurityConfigurerAdapter
* Declare a SecurityFilterChain @Bean using HttpSecurity
- Edit web.xml
- Use @EnableWebMvc

* Can usually be disabled, because the browser does not attach the token automatically
- Must always be enabled
- Replaces the need for JWT
- Is handled by CORS

Q: Difference between HS256 and RS256 JWT signing?
- HS256 is asymmetric, RS256 is symmetric
* HS256 uses one shared secret; RS256 signs with a private key and verifies with a public key
- RS256 encrypts the payload
- There is no difference

Q: HTTP 401 vs 403?

- Both mean server error

* ROLE_ADMIN

## Explain the JWT authentication flow in a Spring Boot + React app.
1. User submits credentials (or is redirected to Keycloak for SSO).
2. The auth server validates them and issues a short-lived **access token** (JWT, signed RS256) and a **refresh token**.
3. React keeps the access token in memory (not localStorage, to limit XSS theft); refresh token in an HttpOnly, Secure, SameSite cookie.
4. Each API call sends {{Authorization: Bearer <token>}}.
5. Spring Security's {{BearerTokenAuthenticationFilter}} validates signature (public key from JWKS), {{exp}}, {{iss}}, {{aud}}, then builds an Authentication with authorities from the roles claim.
6. {{@PreAuthorize}} / {{requestMatchers().hasRole()}} enforce RBAC.
7. On 401 the client calls the refresh endpoint, gets a new access token, retries.
8. Logout: revoke the refresh token / end the Keycloak session.
~~~java
@Bean
SecurityFilterChain api(HttpSecurity http) throws Exception {
  return http
    .csrf(csrf -> csrf.disable())
    .sessionManagement(s -> s.sessionCreationPolicy(SessionCreationPolicy.STATELESS))
    .authorizeHttpRequests(a -> a
        .requestMatchers("/actuator/health", "/api/public/**").permitAll()
        .requestMatchers(HttpMethod.POST, "/api/v1/loans/**").hasRole("LOAN_OFFICER")
        .anyRequest().authenticated())
    .oauth2ResourceServer(o -> o.jwt(Customizer.withDefaults()))
    .build();
}
~~~
## Explain OAuth2 roles and the Authorization Code + PKCE flow.
- **Resource owner**: the user. **Client**: the app (React SPA). **Authorization server**: Keycloak. **Resource server**: the Spring Boot API.
- Flow: client makes a random {{code_verifier}} and sends its SHA-256 {{code_challenge}} with the redirect to {{/authorize}}; user logs in; Keycloak redirects back with a one-time **code**; client exchanges code + code_verifier at {{/token}}; receives access, refresh and ID tokens.
- PKCE stops an attacker who intercepts the code from redeeming it.
## How would you integrate Keycloak SSO across several PKSF apps?
- One realm (e.g. {{pksf}}); a client per app: public clients for SPAs (PKCE), confidential clients for backends, service accounts for machine-to-machine.
- Realm roles (e.g. {{ADMIN}}, {{PO_USER}}) and client roles; groups per partner organisation; map roles into tokens.
- Spring Boot: {{spring-boot-starter-oauth2-resource-server}} with {{issuer-uri}}; a {{JwtAuthenticationConverter}} that reads {{realm_access.roles}} and adds the {{ROLE_}} prefix.
- React: keycloak-js or oidc-client-ts; Angular: angular-oauth2-oidc. Silent token refresh.
- Benefits: single login across apps, central password policy, MFA, LDAP/AD federation, central user deprovisioning.
## Design an RBAC data model.
~~~sql
users(id, username, password_hash, enabled, partner_org_id)
roles(id, name)                 -- ADMIN, PO_MANAGER, FIELD_OFFICER
permissions(id, code)           -- LOAN_READ, LOAN_APPROVE, REPORT_SUBMIT
user_roles(user_id, role_id)
role_permissions(role_id, permission_id)
~~~
Load permissions as authorities at login; protect endpoints with {{hasAuthority('LOAN_APPROVE')}}. Add **data-level** checks too (a PO user may only see their own PO's rows), e.g. filter queries by {{partner_org_id}} taken from the token, never from the request body.
## Hashing vs encryption vs encoding?
- **Encoding** (Base64, URL encoding): reversible format change, no key, no security.
- **Encryption** (AES, RSA): reversible with a key; protects confidentiality (data at rest, TLS in transit).
- **Hashing** (SHA-256; BCrypt/Argon2 for passwords): one-way, fixed length; used for integrity and password storage. Salt prevents rainbow-table attacks.
## Name OWASP Top 10 risks and how you mitigate them in a Spring/React stack.
- **Broken access control**: deny by default, method security, object-level ownership checks.
- **Cryptographic failures**: TLS everywhere, BCrypt, encrypt sensitive columns, keys in a vault/K8s secrets.
- **Injection**: parameterised queries/JPA, validation.
- **Insecure design**: threat modelling, rate limits.
- **Security misconfiguration**: lock down Actuator, no default creds, security headers.
- **Vulnerable components**: dependency scanning (OWASP Dependency-Check, Dependabot, Trivy for images).
- **Identification and authentication failures**: Keycloak, MFA, short token lifetimes.
- **Software and data integrity failures**: signed artifacts, protected CI/CD.
- **Logging and monitoring failures**: audit logs to ELK, alerts.
- **SSRF**: allow-list outbound URLs.

Q: The best fix for the N+1 select problem when loading orders with their items is:
- Make every association EAGER
* Use JOIN FETCH in JPQL or an @EntityGraph (or batch fetching)
- Increase the connection pool size
- Use native SQL everywhere
E: N+1 = 1 query for parents + 1 per parent for children. A fetch join loads both in one query. EAGER makes things worse elsewhere.
Q: Default fetch type of {{@ManyToOne}} and {{@OneToMany}}?
* @ManyToOne EAGER, @OneToMany LAZY
- Both LAZY
- Both EAGER
- @ManyToOne LAZY, @OneToMany EAGER
E: To-one associations default to EAGER, to-many to LAZY. Best practice: set @ManyToOne(fetch = LAZY) explicitly.
Q: {{LazyInitializationException}} happens when:
- The database is down
* A lazy association is accessed after the persistence context (session) has closed
- Two transactions update the same row
- An entity has no @Id
E: Typical cause: returning entities from a service and serialising them in the controller. Fix with fetch joins, DTO projections, or mapping inside the transaction. Avoid open-in-view in APIs.
Q: The four entity states in JPA are:
* Transient (new), managed, detached, removed
- New, saved, flushed, committed
- Open, closed, cached, evicted
- Created, read, updated, deleted
E: persist() makes a new entity managed; when the EntityManager closes, entities become detached; merge() re-attaches a copy.
Q: In a bidirectional @OneToMany/@ManyToOne, {{mappedBy}} is placed on:
- The owning side (with the foreign key)
* The inverse (non-owning) side, usually the @OneToMany collection
- Both sides
- Neither side
E: The @ManyToOne side owns the foreign key column. Only changes on the owning side are written to the DB, so keep both sides in sync with helper methods.
Q: What does {{@Version}} on an entity field provide?
- Audit history
* Optimistic locking: an update fails with OptimisticLockException if someone else changed the row
- Pessimistic row locks
- Schema migration
E: Hibernate adds WHERE version = ? to updates and increments it. Great for concurrent edits of the same loan or report.
Q: Hibernate's first-level cache is:
* Scoped to one Session/EntityManager and always enabled
- Shared across the whole application
- Disabled by default
- Stored in Redis
E: Within one persistence context, loading the same id twice returns the same instance without a second query. The second-level cache (Ehcache etc.) is optional and shared.
Q: Which ID generation strategy disables Hibernate JDBC batch inserts?
- SEQUENCE
* IDENTITY
- TABLE
- UUID
E: With IDENTITY the ID is only known after each INSERT executes, so Hibernate can't batch. Use SEQUENCE with an allocationSize on PostgreSQL/Oracle for bulk inserts.
Q: Which Spring Data method name is valid for "find active users by email"?
* findByEmailAndActiveTrue(String email)
- getUsersWhereEmailAndActive(String email)
- queryEmailActive(String email)
- selectByEmail_Active(String email)
E: Derived queries parse names like findBy, And, Or, Between, LessThan, Containing, OrderBy, True/False.
Q: JPQL queries are written against:
- Database tables and columns
* Entity class names and their fields
- XML mapping files
- Stored procedures
E: SELECT p FROM PartnerOrg p WHERE p.code = :code uses entity names. Use nativeQuery = true for raw SQL.
Q: Recommended {{spring.jpa.hibernate.ddl-auto}} value in production:
- create-drop
- update
* validate (or none), with schema changes managed by Flyway or Liquibase
- create
E: update can make unpredictable or destructive changes. Versioned migrations are reviewable and repeatable.
Q: What does {{orphanRemoval = true}} do?
- Deletes the parent when a child is removed
* Deletes a child entity when it is removed from the parent's collection
- Removes null fields
- Drops unused tables
E: Use it for composition (e.g. invoice lines). CascadeType.REMOVE only deletes children when the parent itself is deleted.
Q: Dirty checking means:
* Changes to a managed entity are detected and flushed automatically at flush/commit, without calling save()
- Hibernate validates input data
- Rows are locked while being edited
- Unused entities are garbage-collected
E: Hibernate compares the entity with its snapshot at flush time. readOnly transactions skip this for speed.
Q: How do you return a page of 20 results sorted by name with Spring Data?
- findAll().subList(0, 20)
* repo.findAll(PageRequest.of(page, 20, Sort.by("name")))
- LIMIT 20 in application.yml
- @Page(20)
E: Page<T> also returns totalElements and totalPages. For huge tables, consider Slice or keyset pagination.
Q: Which locking mode issues SELECT ... FOR UPDATE?
- @Version
* @Lock(LockModeType.PESSIMISTIC_WRITE)
- @Transactional(readOnly = true)
- LockModeType.NONE
E: Pessimistic locks block other writers until commit. Use them for short, high-contention operations like balance updates.

## Explain the N+1 problem with an example and three solutions.
~~~java
List<PartnerOrg> pos = repo.findAll();          // 1 query
for (PartnerOrg po : pos) po.getBranches().size(); // N more queries, one per PO
~~~
Solutions:
- **Fetch join**: {{@Query("select p from PartnerOrg p left join fetch p.branches")}} (watch out: fetch-joining a collection breaks DB-side pagination).
- **@EntityGraph(attributePaths = "branches")** on the repository method.
- **Batch fetching**: {{hibernate.default_batch_fetch_size=50}} loads children with IN (...) in a few queries.
- **DTO projection**: select only the columns you need.
Detect it with SQL logging ({{spring.jpa.show-sql}}, or better {{logging.level.org.hibernate.SQL=debug}}) or Hibernate statistics.
## Optimistic vs pessimistic locking: when to use each?
- **Optimistic** ({{@Version}}): no DB lock; the update checks the version and fails if it changed. Best for low-conflict, user-facing edits (two officers editing the same PO profile). Handle {{OptimisticLockException}} by showing "data changed, reload".
- **Pessimistic** ({{@Lock(PESSIMISTIC_WRITE)}} = SELECT FOR UPDATE): locks the row until commit. Best for short, high-conflict operations like decrementing a fund balance. Risk: deadlocks and waiting; keep transactions short and lock rows in a consistent order.
## How do you make bulk inserts fast with JPA?
- Use SEQUENCE ids with {{allocationSize}} (not IDENTITY).
- {{spring.jpa.properties.hibernate.jdbc.batch_size=500}}, {{order_inserts=true}}, {{order_updates=true}}.
- Flush and clear the EntityManager every N records to keep memory flat.
- For very large loads use JdbcTemplate {{batchUpdate}} or PostgreSQL {{COPY}}.
- Add {{reWriteBatchedInserts=true}} to the PostgreSQL JDBC URL.
## Entity vs DTO: why not return entities from controllers?
- Entities expose internal structure and sensitive fields, cause lazy-loading exceptions or N+1 during JSON serialisation, and couple the API to the DB schema.
- DTOs (Java records) give a stable API contract, validation per use case, and allow projections ({{select new com.x.PoSummary(p.id, p.name) from PartnerOrg p}}).
- Mapping by hand or with MapStruct.

Q: Difference between WHERE and HAVING?
* WHERE filters rows before grouping; HAVING filters groups after GROUP BY

1. Reproduce and measure: {{EXPLAIN (ANALYZE, BUFFERS)}}; check {{pg_stat_statements}} for top queries.

## When would you choose MongoDB over PostgreSQL?
- **PostgreSQL**: relational data with strong integrity (loans, repayments, accounts), multi-row ACID transactions, complex joins and reporting. Financial records belong here.
- **MongoDB**: flexible or evolving schemas (survey forms with varying fields, field-collected data, activity logs, content), large write volumes, natural document aggregates read together, easy horizontal scaling.
- PostgreSQL JSONB often covers the flexible-field case without a second database.
## Explain caching strategies and invalidation.
- **Cache-aside** (lazy loading): most common; @Cacheable.
- **Read-through / write-through**: the cache layer loads from and writes to the DB itself.
- **Write-behind**: write to cache, flush to DB asynchronously (risk of loss).
- Invalidation: TTLs, explicit eviction on update (@CacheEvict), versioned keys, events (publish change messages).
- Pitfalls: stale data, stampede, caching per-user data under a shared key, unbounded memory. Never cache sensitive data without thinking about who can read it.

@Cacheable(cacheNames = "po", key = "#id")
public PartnerOrgDto get(Long id) { ... }

@CacheEvict(cacheNames = "po", key = "#dto.id")
public PartnerOrgDto update(PartnerOrgDto dto) { ... }
~~~

- Cache for reference data and expensive report results.
- Distributed session store (Spring Session).
- Rate limiting (INCR + EXPIRE per user/IP).
- Distributed locks (Redisson, SET key value NX PX) so only one instance runs a scheduled job.
- Token blacklist for revoked JWTs until their exp.
- Pub/Sub or Streams for lightweight messaging.

## Monolith vs microservices: trade-offs, and which would you choose for PKSF?
- **Monolith**: simple to build, test, deploy and debug; one database and ACID transactions; scales as a whole. Risk: tight coupling as it grows.
- **Microservices**: independent deploys and scaling, team autonomy, fault isolation, tech flexibility. Cost: network calls, distributed transactions, observability, DevOps maturity.
- A sensible answer: start with a **modular monolith** with clear boundaries (members, loans, reporting, identity), extract services where scaling or team needs justify it (e.g. report generation, notifications), with Keycloak, a gateway and centralised logging in place first.
## List REST API design best practices.
- Nouns and plural resources: {{GET /api/v1/partner-orgs/{id}/branches}}.
- Correct methods and status codes (201 + Location, 204, 400, 401, 403, 404, 409, 422, 429).
- Pagination, filtering, sorting: {{?page=0&size=20&sort=name,asc&district=Dhaka}}.
- Consistent error body (ProblemDetail: type, title, status, detail, errors).
- Versioning; backward compatibility; idempotency keys for POST payments.
- Security: HTTPS, OAuth2/JWT, input validation, rate limiting, no sensitive data in URLs.
- Documentation with OpenAPI; ETags for caching/concurrency.
## How do you keep data consistent across services (distributed transaction)?
- Avoid 2PC; use a **saga**. Example: Disbursement service reserves funds > Loan service creates the loan > Notification service sends SMS. If the loan step fails, a compensating action releases the funds.
- **Choreography**: services react to each other's events. **Orchestration**: one orchestrator tells each step what to do (easier to follow).
- **Transactional outbox**: write the business row and an outbox event in the same local transaction; a relay publishes the outbox to RabbitMQ/Kafka. Consumers must be **idempotent** (dedupe by event id).
## REST vs SOAP?
- **REST**: architectural style over HTTP, resources and verbs, usually JSON, lightweight, cacheable, OpenAPI docs.
- **SOAP**: protocol, XML envelope, WSDL contract, WS-Security / WS-ReliableMessaging, works over HTTP/SMTP; common in banking and government integrations.
- Choose SOAP when integrating with systems that require it (e.g. some bank or government gateways); REST for new web/mobile APIs.

import { useEffect, useState } from "react";

export function useFetch(url, token) {
  const [state, setState] = useState({ data: null, error: null, loading: true });

  useEffect(() => {
    const ctrl = new AbortController();
    setState(s => ({ ...s, loading: true }));
    fetch(url, { signal: ctrl.signal, headers: { Authorization: "Bearer " + token } })
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(data => setState({ data, error: null, loading: false }))
      .catch(err => { if (err.name !== "AbortError") setState({ data: null, error: err, loading: false }); });
    return () => ctrl.abort();
  }, [url, token]);

  return state;
}

// usage
function PoList() {
  const { data, error, loading } = useFetch("/api/v1/partner-orgs", token);
  if (loading) return <p>Loading...</p>;
  if (error) return <p role="alert">{error.message}</p>;
  return <ul>{data.content.map(po => <li key={po.id}>{po.name}</li>)}</ul>;
}
~~~

- Prefer the Authorization Code + PKCE flow via Keycloak.

1. **Upload**: React/Angular uploads the file (multipart, or a pre-signed URL to object storage); show progress.

3. **Worker**: Spring Batch chunk step reads rows (streaming), validates (mandatory fields, totals, PO ownership), writes with JDBC batching; invalid rows go to an error table.
4. **Status**: job row updated (RUNNING, COMPLETED, FAILED; counts); UI polls {{GET /jobs/{id}}} or receives a WebSocket/STOMP push; a downloadable error report.

4. **App side**: HikariCP metrics (active, pending connections, acquire time), N+1 queries, transactions held open during remote calls.
5. **Logs** in Kibana filtered by correlation ID and error level.
6. **Fix and verify**: index/query fix, pool sizing, caching, then watch the dashboard return to baseline; add an alert so it's caught earlier next time.

## Reverse a singly linked list (Java).
~~~java
ListNode reverse(ListNode head) {
  ListNode prev = null, cur = head;
  while (cur != null) {
    ListNode next = cur.next;
    cur.next = prev;
    prev = cur;
    cur = next;
  }
  return prev;
}
~~~
O(n) time, O(1) space.
## Two Sum: return indices of two numbers adding to target.
~~~java
int[] twoSum(int[] nums, int target) {
  Map<Integer, Integer> seen = new HashMap<>();
  for (int i = 0; i < nums.length; i++) {
    Integer j = seen.get(target - nums[i]);
    if (j != null) return new int[]{j, i};
    seen.put(nums[i], i);
  }
  return new int[0];
}
~~~
O(n) time with a hash map instead of O(n²) nested loops.
## Check whether brackets in a string are balanced.
~~~java
boolean balanced(String s) {
  Deque<Character> st = new ArrayDeque<>();
  for (char c : s.toCharArray()) {
    if (c == '(' || c == '[' || c == '{') st.push(c);
    else if (c == ')' || c == ']' || c == '}') {
      if (st.isEmpty()) return false;
      char o = st.pop();
      if ((c == ')' && o != '(') || (c == ']' && o != '[') || (c == '}' && o != '{')) return false;
    }
  }
  return st.isEmpty();
}
~~~
## Check if a string is a palindrome (ignore case and non-alphanumerics).
~~~java
boolean isPalindrome(String s) {
  int i = 0, j = s.length() - 1;
  while (i < j) {
    while (i < j && !Character.isLetterOrDigit(s.charAt(i))) i++;
    while (i < j && !Character.isLetterOrDigit(s.charAt(j))) j--;
    if (Character.toLowerCase(s.charAt(i++)) != Character.toLowerCase(s.charAt(j--))) return false;
  }
  return true;
}
~~~

function startMock(){
  const tps=[...document.querySelectorAll('input[name=tp]:checked')].map(x=>x.value);

  const pool=ALLQ.filter(q=>tps.includes(q.topic));
  const cnt=Math.min(+document.querySelector('input[name=cnt]:checked').value,pool.length);
  const per=+document.querySelector('input[name=tm]:checked').value;
  // balanced sample: round-robin across chosen topics
  const buckets=tps.map(id=>shuffle(pool.filter(q=>q.topic===id)));const pick=[];
  while(pick.length<cnt){let added=false;for(const b of buckets){if(b.length&&pick.length<cnt){pick.push(b.pop());added=true}}if(!added)break}

  if(h==='quiz')quiz();else if(h==='mock')mock();else if(h==='cards')cards();else if(h==='weak')weak();else if(h.startsWith('t-'))topic(h.slice(2));else home();
}
let lastHash='';
window.addEventListener('hashchange',()=>{const h=location.hash;if(h.startsWith('#t-')&&lastHash!==h&&!lastHash.startsWith('#quiz'))topicTab='quiz';lastHash=h;render();if(h!=='#quiz')window.scrollTo(0,0)});
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='tab'){topicTab=b.dataset.k;render()}
  else if(a==='tq'){const t=TM[location.hash.slice(3)];const qs=b.dataset.only==='1'?t.qs.filter(q=>S.q[q.id]!==1):t.qs;start(shuffle(qs),'practice',t.name+' practice',0)}
  else if(a==='pick')pick(+b.dataset.oi);
  else if(a==='next'){if(sess.i<sess.qs.length-1){sess.i++;quiz();window.scrollTo(0,0)}else finish()}
  else if(a==='prev'){if(sess.i>0){sess.i--;quiz()}}
  else if(a==='go'){sess.i=+b.dataset.i;quiz()}
  else if(a==='submit'){const un=sess.ans.filter(x=>x===null).length;confirmBox(un?`Submit with ${un} unanswered?`:'Submit your exam now?',finish)}
  else if(a==='quit'){const n=sess.ans.filter(x=>x!==null).length;if(!n){sess=null;history.back();return}finish()}
  else if(a==='retry'){const qs=sess.qs.filter((q,i)=>sess.ans[i]!==q.a).map(q=>QM[q.id]);start(shuffle(qs),'practice','Retry missed questions',0)}
  else if(a==='allt')document.querySelectorAll('input[name=tp]').forEach(x=>x.checked=b.dataset.v==='1');
  else if(a==='startmock')startMock();
  else if(a==='weakall')start(shuffle(wrongs()),'practice','Weak spots',0);
  else if(a==='weakt')start(shuffle(wrongs().filter(q=>q.topic===b.dataset.t)),'practice',TM[b.dataset.t].name+' weak spots',0);
  else if(a==='untried')start(shuffle(ALLQ.filter(q=>!(q.id in S.q))),'practice','Never-tried questions',0);
  else if(a==='reset')confirmBox('Erase all saved progress?',()=>{S={q:{},f:{},mocks:[]};save();deck=null;render()});
  else if(a==='show'){deck.shown=true;cards()}
  else if(a==='skip'){deck.i++;deck.shown=false;cards()}
  else if(a==='fk'){S.f[deck.list[deck.i].id]=+b.dataset.v;if(b.dataset.v==='0')deck.list.push(deck.list[deck.i]);save();deck.i++;deck.shown=false;cards();window.scrollTo(0,0)}
  else if(a==='redeck'){newDeck(deck.t,deck.unk);cards()}
});
document.addEventListener('keydown',e=>{
  if(location.hash!=='#quiz'||!sess||sess.done||document.querySelector('.modal'))return;
  if(e.target.matches('input,select,textarea'))return;
  const k=e.key.toLowerCase(),q=sess.qs[sess.i];
  let idx='1234'.indexOf(k);if(idx<0)idx='abcd'.indexOf(k);
  if(idx>=0&&idx<q.order.length){pick(q.order[idx]);return}
  if(k==='enter'||k==='arrowright'){const nb=app.querySelector('[data-act=next]');if(nb){e.preventDefault();nb.click()}}
  if(k==='arrowleft'&&sess.mode==='exam'&&sess.i>0){sess.i--;quiz()}
});
lastHash=location.hash;render();
}

</script>
</body>
